name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Push to main: one group per commit sha, never cancelled, so every commit gets its own verdict.
# Pull requests: one group per ref, newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: mypy --strict src

  # Fast matrix: every push to main and every pull request.
  test:
    if: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
        shell: bash
      - run: pytest -m "not integration and not live" --cov
        shell: bash

  # Full matrix: nightly schedule, manual dispatch and version tags only.
  test-full:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
        shell: bash
      - run: pytest -m "not integration and not live" --cov
        shell: bash

  # The verb matrix on every `verified` engine (spec 8.5, 13, 14.2): service containers for
  # postgres, mysql, clickhouse, sql server and trino, plus duckdb in-process. Every engine is
  # required here, so one that cannot be reached fails the job instead of being skipped.
  # Images are pinned (bump deliberately): SQL Server 2022 CU28, Trino 484.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factlang
          POSTGRES_PASSWORD: factlang
          POSTGRES_DB: factlang
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factlang" --health-interval 5s --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: factlang
          MYSQL_DATABASE: factlang
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pfactlang" --health-interval 5s
          --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: factlang
          CLICKHOUSE_PASSWORD: factlang
          CLICKHOUSE_DB: factlang
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user factlang --password factlang -q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: FactLang-Pass-2026
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P FactLang-Pass-2026 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30
      trino:
        image: trinodb/trino:484
        ports: ["8080:8080"]
        options: >-
          --health-cmd "trino --execute 'SELECT 1'" --health-interval 10s
          --health-timeout 10s --health-retries 30
    env:
      FACTLANG_REQUIRE_ENGINES: postgres,mysql,clickhouse,tsql,trino
      FACTLANG_POSTGRES_DSN: postgresql://factlang:factlang@localhost:5432/factlang
      FACTLANG_MYSQL_DSN: mysql://root:factlang@127.0.0.1:3306/factlang
      FACTLANG_CLICKHOUSE_DSN: clickhouse://factlang:factlang@localhost:8123/factlang
      FACTLANG_TSQL_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD=FactLang-Pass-2026;TrustServerCertificate=yes"
      FACTLANG_TRINO_DSN: trino://factlang@localhost:8080/memory/default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ODBC Driver 18 for SQL Server
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            # the runner may already hold this key and list: overwrite, never prompt
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" \
              | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d -n "ODBC Driver 18 for SQL Server"
      - run: pip install -e ".[dev,postgres,mysql,clickhouse,mssql,trino,mcp,sqlalchemy]"
      - run: pytest -m integration -rs tests/integration
      # The tests that need the optional extras (the real MCP round-trip, real SQLAlchemy)
      # skip in the matrix jobs; here the extras are installed, so a skip is a failure.
      - name: Tests that need the mcp and sqlalchemy extras
        run: |
          # a failing pytest must fail the step even though its output is piped to tee
          set -o pipefail
          pytest -m "not integration and not live" -rs -p no:cacheprovider \
            tests/unit/agent/test_mcp.py tests/unit/connectors/test_sqlalchemy_fake.py \
            | tee extras.log
          ! grep -q SKIPPED extras.log
      # The command line end to end through a SQLAlchemy URL: --dsn and FACTLANG_DSN.
      - name: factlang check --dsn (SQLAlchemy URL, postgres)
        env:
          FL_URL: postgresql+psycopg://factlang:factlang@localhost:5432/factlang
        run: |
          python - <<'PY'
          import psycopg
          url = "postgresql://factlang:factlang@localhost:5432/factlang"
          with psycopg.connect(url, autocommit=True) as conn:
              conn.execute("DROP TABLE IF EXISTS cli_orders")
              conn.execute("CREATE TABLE cli_orders (id INTEGER, status TEXT)")
              conn.execute("INSERT INTO cli_orders VALUES (1, 'paid'), (2, 'open'), (3, 'paid')")
          PY
          printf '%s\n' "ROWS cli_orders VALUE == 3" "UNIQUE cli_orders.id" \
            "VALUES cli_orders.status IN ['paid', 'open']" > cli.fl
          factlang check --dsn "$FL_URL" cli.fl
          FACTLANG_DSN="$FL_URL" factlang --format json check cli.fl > cli.json
          python -c "import json; d = json.load(open('cli.json')); assert d['verified'], d"
          printf '%s\n' "ROWS cli_orders VALUE == 4" > cli-fail.fl
          set +e; factlang check --dsn "$FL_URL" cli-fail.fl; code=$?; set -e
          test "$code" -eq 1

  # The site (site spec 6): the built-site and playground tests with every extra they need
  # (docs, duckdb==1.4.3 for the playground parity tests, Node for the engine.js tests), then
  # the wheel, `mkdocs build --strict`, and the browser e2e suite against that build served on
  # localhost. A skip in any of them is a failure here. It runs on pushes and pull requests
  # that touch the site (the first step decides; otherwise every later step is skipped and
  # the job passes), on the nightly schedule, on manual dispatch and on tags. Docs publishing
  # (docs.yml) runs only after a fully green CI on main, and runs this e2e suite itself again
  # against the exact build it publishes.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the site?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # src: the wheel the playground installs, mkdocstrings, the landing facts;
          # scripts/gen_reference.py: the verb reference page
          paths=(docs site-playground src scripts/docs_hooks.py scripts/gen_reference.py
                 mkdocs.yml tests/playground tests/e2e tests/conformance pyproject.toml
                 .github/workflows/ci.yml .github/workflows/docs.yml)
          if [ "$EVENT" = pull_request ]; then
            range="$BASE...HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            range="$BEFORE...HEAD"
          else
            range=""  # schedule, dispatch, a tag or a new branch: always run
          fi
          if [ -z "$range" ] || [ -n "$(git diff --name-only "$range" -- "${paths[@]}")" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "no site file changed in $range: nothing to do"
          fi
      - if: steps.changes.outputs.site == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.changes.outputs.site == 'true'
        name: Install
        run: |
          pip install -e ".[dev,docs,playground,e2e]"
          node --version
          python -c "import duckdb; assert duckdb.__version__ == '1.4.3', duckdb.__version__"
      - if: steps.changes.outputs.site == 'true'
        name: Build the wheel the playground installs
        run: python -m build --wheel
      - if: steps.changes.outputs.site == 'true'
        name: Generate the verb reference
        run: python scripts/gen_reference.py
      # The built-site tests (landing facts, playground page), the playground parity tests on
      # duckdb 1.4.3 and the Node-based engine.js tests all skip without their extras; here
      # every extra is installed, so a skip is a failure. The one exception is by design, and
      # allowed only with its exact reason and count: test_dialects skips the 8 parametrised
      # table references that have more than three parts.
      - if: steps.changes.outputs.site == 'true'
        name: Site, playground and conformance tests (no skips)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          set -o pipefail
          pytest -rs -p no:cacheprovider tests/playground tests/conformance | tee site-tests.log
          known="SKIPPED [8] tests/conformance/test_dialects.py:306: a TableRef holds at most three parts"
          if grep SKIPPED site-tests.log | grep -vxF "$known"; then
            echo "a site test skipped although every extra is installed"; exit 1
          fi
      - if: steps.changes.outputs.site == 'true'
        name: Build the site
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: steps.changes.outputs.site == 'true'
        name: Playwright version (the browser cache key)
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.site == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - if: steps.changes.outputs.site == 'true'
        name: Install the browsers (Chromium, WebKit) and their system dependencies
        run: |
          for attempt in 1 2 3; do
            python -m playwright install --with-deps chromium webkit && exit 0
            echo "playwright install failed (attempt $attempt), retrying"; sleep $((attempt * 15))
          done
          exit 1
      - if: steps.changes.outputs.site == 'true'
        name: Browser e2e against the built site
        env:
          # served under a sub-path, as GitHub Pages serves the project site (serve.py)
          FL_SITE_URL: http://127.0.0.1:8000/factlang/
          FL_E2E_WEBKIT: "1"
        run: |
          set -o pipefail
          python tests/e2e/serve.py site 8000 /factlang/ > http.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null "$FL_SITE_URL" && break; sleep 1; done
          pytest -rs -p no:cacheprovider tests/e2e | tee e2e.log
          ! grep -q SKIPPED e2e.log

  build:
    # Exactly one of test / test-full runs; the other is skipped. Build proceeds only when
    # lint, integration and the test job that ran all succeeded (a skipped job counts as
    # passing here).
    needs: [lint, test, test-full, integration]
    if: ${{ always() && needs.lint.result == 'success' && needs.integration.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs['test-full'].result == 'success' || needs['test-full'].result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
